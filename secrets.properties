API_BASE_URL=https://djaxfn1a2gzj8.cloudfront.net
# API_BASE_URL=http://192.168.100.199:3000 (desarrollo local)
FAKE_LOGIN=false

# ========== Configuración de Timers (en segundos) ==========
# Intervalo de escaneo de beacons
SCAN_INTERVAL_SECONDS=2

# Intervalo para enviar eventos en batch
EVENT_BATCH_INTERVAL_SECONDS=15

# Intervalo para enviar lecturas de beacons al servidor
BEACON_READING_INTERVAL_SECONDS=15

# Intervalo de verificación de señal
SIGNAL_CHECK_INTERVAL_SECONDS=2

# Intervalo de heartbeat (keepalive)
HEARTBEAT_INTERVAL_SECONDS=60

# Delay antes de marcar salida definitiva (cuando se pierde señal)
EXIT_DELAY_SECONDS=120

# Timeout para considerar señal perdida
SIGNAL_LOST_THRESHOLD_SECONDS=5

# Intervalo de actualización de filtros en UI
FILTER_UPDATE_INTERVAL_SECONDS=1
